services:
  db:
    image: postgres:17-alpine
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: data_crypto
      POSTGRES_DB: data_crypto


  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

  redis:
    image: redis:8.10.0-alpine
    restart: always
    ports:
      - "6379:6379"
