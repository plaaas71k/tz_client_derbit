services:
  db:
    image: postgres:17-alpine
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_USER: postgres
      POSTGRES_DB: crypto_db



  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

  redis:
    image: redis:8.10.0-alpine
    restart: always
    ports:
      - "6379:6379"
